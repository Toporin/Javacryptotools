; Template for API keys used by javacryptotools explorers.
; Copy this file to api_keys.ini (ignored by git) and fill in your own keys.
; In your application, pass the keys to coin constructors as a Map<String, String>, e.g.:
;   apikeys.put("API_KEY_ETHERSCAN", "...");
;   Polygon coin = new Polygon(true, apikeys);
; api_keys.ini is also used by the network integration tests (./gradlew integrationTest).

[APIKEYS]
; Etherscan API V2 (https://etherscan.io/apis): one key for all supported EVM chains.
; Used for Polygon Amoy testnet.
API_KEY_ETHERSCAN = YOUR_ETHERSCAN_API_KEY
